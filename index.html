
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabMate - Peminjaman Laboratorium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-info">
            <div class="logo">⚗ LabMate</div>
            <h1>Teman digital untuk peminjaman alat laboratorium</h1>
            <p>
                Kelola peminjaman alat laboratorium dengan
                lebih mudah, cepat, dan terorganisir.
            </p>
        </div>

        <div class="login-form">
            <h2>Selamat Datang!</h2>
            <p>Silakan login untuk melanjutkan.</p>

            <form id="loginForm">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    required
                >

                <button type="submit">Login Sekarang →</button>
            </form>

            <p class="login-footer">
                Sistem Informasi Peminjaman Laboratorium
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
